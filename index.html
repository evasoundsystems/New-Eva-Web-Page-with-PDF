<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E.V.A Worship Engineer | Elevation Voice Audio</title>
    <meta
      name="description"
      content="Professional worship & event sound engineering, turnkey AV installations, $50/week on-call care plans, volunteer training, and pro audio gear sales by Luis Martinez."
    />
    <meta property="og:title" content="E.V.A Worship Engineer | Elevation Voice Audio" />
    <meta
      property="og:description"
      content="Live sound engineering, AV installations, $50/week priority care plans, and best-price pro audio gear sales."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8F8F6] text-[#141518] antialiased overflow-x-clip">
    <div id="root">
      <div
        id="eva-boot-shell"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#F8F8F6;color:#141518;"
      >
        <div
          style="max-width:440px;width:100%;background:#FFFFFF;border:1px solid #E7E5E4;border-radius:16px;padding:28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.05);"
        >
          <p
            style="margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#B0721E;"
          >
            Elevation Voice Audio
          </p>
          <h1
            style="margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:-0.01em;color:#141518;"
          >
            E.V.A Worship Engineer
          </h1>
          <p id="eva-boot-status" style="margin:0;font-size:14px;color:#57534E;line-height:1.5;">
            Loading pro audio catalog &amp; engineering portal...
          </p>
          <div id="eva-boot-actions" style="display:none;margin-top:16px;">
            <p
              id="eva-boot-detail"
              style="margin:0 0 14px;font-size:12px;font-family:monospace;color:#78716C;background:#F5F5F4;border:1px solid #E7E5E4;border-radius:8px;padding:10px;word-break:break-word;"
            ></p>
            <button
              type="button"
              onclick="window.location.reload()"
              style="background:#141518;color:#FFFFFF;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;"
            >
              Reload Preview
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function showBootError(msg) {
          if (window.__EVA_APP_MOUNTED__) return;
          var statusEl = document.getElementById('eva-boot-status');
          var actionsEl = document.getElementById('eva-boot-actions');
          var detailEl = document.getElementById('eva-boot-detail');
          if (statusEl) {
            statusEl.textContent =
              'The preview could not finish loading in this browser frame. Try Reload Preview or open the preview in a new browser tab.';
          }
          if (detailEl) {
            detailEl.textContent = msg || 'Module script did not finish booting.';
          }
          if (actionsEl) {
            actionsEl.style.display = 'block';
          }
        }
        window.__EVA_SHOW_BOOT_ERROR__ = showBootError;
        window.addEventListener('error', function (ev) {
          if (!window.__EVA_APP_MOUNTED__) {
            showBootError((ev && ev.message) || 'Script failed to load.');
          }
        });
        window.addEventListener('unhandledrejection', function (ev) {
          if (!window.__EVA_APP_MOUNTED__) {
            var r = ev && ev.reason;
            showBootError(r && r.message ? r.message : String(r || 'Startup promise rejected.'));
          }
        });
        window.setTimeout(function () {
          if (!window.__EVA_APP_MOUNTED__) {
            showBootError('Startup timed out waiting for app modules. Try hard-refreshing or opening in a new tab.');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
